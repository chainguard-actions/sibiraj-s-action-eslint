name: Test invalid package manager
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          all-files: 'true'
          package-manager: yarn
          annotations: 'false'

      - name: Assert action fails with unsupported package manager error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for unsupported package manager 'yarn'"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed for unsupported package manager 'yarn'"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
