name: Test ESLint action - eslint-args input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up test project with eslint-args
        run: |
          mkdir -p /tmp/eslint-args-input-test
          cd /tmp/eslint-args-input-test

          cat > package.json << 'EOF'
          {
            "name": "eslint-args-input-test",
            "version": "1.0.0",
            "devDependencies": {
              "eslint": "^8.0.0"
            }
          }
          EOF

          # Create a valid JS file
          cat > index.js << 'EOF'
          const greeting = 'hello world';
          console.log(greeting);
          EOF

          cat > .eslintrc.json << 'EOF'
          {
            "env": {
              "node": true,
              "es2021": true
            },
            "rules": {}
          }
          EOF

          npm install --prefer-offline 2>&1 | tail -5

      - name: Run ESLint action with eslint-args flag
        id: eslint
        uses: .
        with:
          all-files: 'true'
          working-directory: /tmp/eslint-args-input-test
          annotations: 'false'
          extensions: js
          eslint-args: '--max-warnings=0'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action completed with eslint-args
        run: |
          echo "ESLint action completed with eslint-args"
          echo "PASS: ESLint ran with --max-warnings=0 flag"
