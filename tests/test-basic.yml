name: Test basic usage - eslint on all files
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run eslint on all files in the fixture project.
      # Using all-files: true avoids the GitHub API call (which requires a
      # valid commit SHA in the remote repo — not guaranteed under act).
      # The fixture has a minimal eslint config and a valid JS file.
      - id: action
        uses: .
        with:
          all-files: 'true'
          working-directory: tests/fixtures/eslint-project
          annotations: 'false'

      - name: Assert action succeeded
        run: |
          echo "Action completed successfully"
          echo "PASS: ESLint action ran without errors on fixture project"
