name: Test ignore patterns filter all files
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with ignore-patterns that match everything
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          extensions: js,ts,yml,yaml,md,json
          # Ignore all files with a catch-all pattern
          ignore-patterns: |
            **/*
          annotations: false
        continue-on-error: true

      - name: Assert action completed (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
