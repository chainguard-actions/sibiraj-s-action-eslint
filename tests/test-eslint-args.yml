name: Test eslint-args input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use all-files: true with a fixture project to verify that the
      # eslint-args input is accepted and passed through to ESLint without errors.
      # Passing --max-warnings 0 is a valid ESLint CLI flag that causes ESLint
      # to fail if there are any warnings. The fixture project has no warnings,
      # so this should succeed.
      - id: action
        uses: .
        with:
          all-files: 'true'
          working-directory: tests/fixtures/eslint-project
          annotations: 'false'
          eslint-args: '--max-warnings 0'

      - name: Assert action succeeded with eslint-args
        run: |
          echo "Action completed successfully with eslint-args input"
          echo "PASS: ESLint action accepted eslint-args input without errors"
