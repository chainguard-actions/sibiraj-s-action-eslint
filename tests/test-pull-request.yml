name: Test ESLint on pull request event
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a minimal Node project with ESLint
      - name: Set up test project
        run: |
          mkdir -p /tmp/pr-test-project
          cd /tmp/pr-test-project
          cat > package.json <<'EOF'
          {
            "name": "pr-test-project",
            "version": "1.0.0",
            "devDependencies": {
              "eslint": "^8.0.0"
            }
          }
          EOF
          npm install --save-dev eslint
          cat > .eslintrc.json <<'EOF'
          {
            "env": {
              "browser": true,
              "es2021": true
            },
            "rules": {}
          }
          EOF
          cat > app.js <<'EOF'
          const greeting = 'hello';
          console.log(greeting);
          EOF

      - name: Run ESLint action in PR context (all-files mode)
        id: eslint
        uses: .
        with:
          token: ${{ github.token }}
          all-files: 'true'
          extensions: 'js'
          annotations: 'false'
          working-directory: /tmp/pr-test-project
        continue-on-error: true

      - name: Assert action ran without crashing
        run: |
          echo "ESLint action ran in PR event context"
          echo "PASS"
