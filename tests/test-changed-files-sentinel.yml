name: Test changed-files mode with sentinel repo
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          all-files: 'false'
          annotations: 'false'
        continue-on-error: true

      - name: Assert action failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action calls GitHub API with the sentinel repo which does not exist,
          # so it is expected to fail. We just verify it did not hang or crash unexpectedly.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (sentinel repo is not resolvable)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no changed files found, skipped linting)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
