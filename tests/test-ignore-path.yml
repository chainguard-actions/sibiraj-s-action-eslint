name: Test ignore-path input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use all-files: true with a fixture project to verify that the
      # ignore-path input is accepted and used without errors.
      # The ignore-path points to a committed fixture file listing patterns to ignore.
      - id: action
        uses: .
        with:
          all-files: 'true'
          working-directory: tests/fixtures/eslint-project
          annotations: 'false'
          ignore-path: tests/fixtures/eslintignore-example

      - name: Assert action succeeded with ignore-path
        run: |
          echo "Action completed successfully with ignore-path input"
          echo "PASS: ESLint action accepted ignore-path input without errors"
