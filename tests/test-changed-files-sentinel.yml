name: Test changed-files mode (sentinel repo)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          all-files: 'false'
          annotations: 'false'

      - name: Assert action fails gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action calls the GitHub API with the sentinel repo (which doesn't exist),
          # so it is expected to fail. A success outcome would mean the API call somehow
          # worked (e.g. no files changed), which is also acceptable.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (sentinel repo not resolvable)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no changed files found or API call worked)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
