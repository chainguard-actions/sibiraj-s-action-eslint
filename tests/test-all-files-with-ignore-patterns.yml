name: Test all-files mode with ignore patterns
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ESLint in fixture project
        run: |
          cd "$GITHUB_WORKSPACE/tests/fixtures/eslint-project"
          npm install --prefer-offline 2>&1 || npm install

      - id: action
        uses: .
        continue-on-error: true
        with:
          all-files: 'true'
          working-directory: tests/fixtures/eslint-project
          annotations: 'false'
          ignore-patterns: |
            node_modules/**
            dist/**

      - name: Assert action ran with ignore patterns
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run ESLint with ignore patterns applied.
          # Success means no lint errors; failure means lint errors found (both are valid runs).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with ignore patterns"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with ignore patterns (lint issues found or ESLint error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
