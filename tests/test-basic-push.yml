name: Test basic push event
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ESLint locally
        run: |
          npm install --prefix /tmp/eslint-root eslint@8 2>/dev/null || true

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          extensions: js
          annotations: false
          root-dir: /tmp/eslint-root
        continue-on-error: true

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail (not be skipped)
          # Under act, GitHub API calls may fail, which is acceptable
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was unexpectedly skipped"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
