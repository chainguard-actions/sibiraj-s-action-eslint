name: Test ESLint with custom args and ignore patterns
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a minimal Node project with ESLint
      - name: Set up test project
        run: |
          mkdir -p /tmp/custom-args-project
          cd /tmp/custom-args-project
          cat > package.json <<'EOF'
          {
            "name": "custom-args-project",
            "version": "1.0.0",
            "devDependencies": {
              "eslint": "^8.0.0"
            }
          }
          EOF
          npm install --save-dev eslint
          cat > .eslintrc.json <<'EOF'
          {
            "env": {
              "browser": true,
              "es2021": true
            },
            "rules": {
              "no-console": "warn"
            }
          }
          EOF
          cat > main.js <<'EOF'
          const value = 42;
          console.log(value);
          EOF
          cat > ignored.js <<'EOF'
          var bad = undefined;
          EOF

      - name: Run ESLint action with custom args and ignore patterns
        id: eslint
        uses: .
        with:
          token: ${{ github.token }}
          all-files: 'true'
          extensions: 'js'
          annotations: 'false'
          working-directory: /tmp/custom-args-project
          eslint-args: '--max-warnings=100'
          ignore-patterns: 'ignored.js'
        continue-on-error: true

      - name: Assert action ran with custom args
        run: |
          echo "ESLint action ran with custom eslint-args and ignore-patterns"
          echo "PASS"
