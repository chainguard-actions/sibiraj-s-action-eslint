name: Test basic usage (smoke test)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with basic inputs
        id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          # Use a non-matching extension so no files are linted
          # (avoids needing ESLint installed for this basic smoke test)
          extensions: nonexistent_xyz_abc
          annotations: false
        continue-on-error: true

      - name: Assert action completed (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
