name: Test ESLint on all files
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a minimal Node project with ESLint in a subdirectory
      - name: Set up test project
        run: |
          mkdir -p /tmp/test-project
          cd /tmp/test-project
          cat > package.json <<'EOF'
          {
            "name": "test-project",
            "version": "1.0.0",
            "devDependencies": {
              "eslint": "^8.0.0"
            }
          }
          EOF
          npm install --save-dev eslint
          cat > .eslintrc.json <<'EOF'
          {
            "env": {
              "browser": true,
              "es2021": true
            },
            "rules": {}
          }
          EOF
          cat > index.js <<'EOF'
          const x = 1;
          console.log(x);
          EOF

      - name: Run ESLint action on all files
        id: eslint
        uses: .
        with:
          token: ${{ github.token }}
          all-files: 'true'
          extensions: 'js'
          annotations: 'false'
          working-directory: /tmp/test-project
        continue-on-error: true

      - name: Assert action completed
        run: |
          echo "ESLint action completed (exit may be non-zero if no files matched, that is acceptable)"
          echo "PASS"
