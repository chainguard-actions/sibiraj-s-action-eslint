name: Test ignore-patterns input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use all-files: true with a fixture project to verify that the
      # ignore-patterns input is accepted without errors.
      # Note: ignore-patterns only applies when all-files is false (changed files mode),
      # but the input must still be accepted and not cause a startup error.
      # Using all-files: true avoids the GitHub API call.
      - id: action
        uses: .
        with:
          all-files: 'true'
          working-directory: tests/fixtures/eslint-project
          annotations: 'false'
          ignore-patterns: |
            bad.js
            dist/**

      - name: Assert action succeeded with ignore patterns
        run: |
          echo "Action completed successfully with ignore-patterns input"
          echo "PASS: ESLint action accepted ignore-patterns input without errors"
