name: Test all-files mode
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ESLint in fixture project
        run: |
          cd "$GITHUB_WORKSPACE/tests/fixtures/eslint-project"
          npm install --prefer-offline 2>&1 || npm install

      - id: action
        uses: .
        continue-on-error: true
        with:
          all-files: 'true'
          working-directory: tests/fixtures/eslint-project
          annotations: 'false'

      - name: Assert action ran (all-files mode)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded in all-files mode"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and reported lint issues (acceptable outcome)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
