name: Test ESLint all-files mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JS project with multiple files
        run: |
          mkdir -p /tmp/eslint-multi
          cd /tmp/eslint-multi
          cat > package.json <<'EOF'
          {
            "name": "eslint-multi-test",
            "version": "1.0.0",
            "devDependencies": {
              "eslint": "^8.57.0"
            }
          }
          EOF
          cat > .eslintrc.json <<'EOF'
          {
            "env": {
              "node": true,
              "es2021": true
            },
            "rules": {
              "semi": ["error", "always"]
            }
          }
          EOF
          cat > a.js <<'EOF'
          const a = 1;
          module.exports = a;
          EOF
          cat > b.js <<'EOF'
          const b = 2;
          module.exports = b;
          EOF
          npm install --silent

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          all-files: 'true'
          extensions: js
          annotations: 'false'
          working-directory: /tmp/eslint-multi

      - name: Assert action ran on all files
        run: |
          echo "ESLint ran on all files successfully"
          echo "PASS"
