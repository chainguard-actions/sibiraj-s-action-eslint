name: Test all-files with ignore-patterns
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up ESLint project
        run: |
          mkdir -p /tmp/eslint-ignore-project
          cat > /tmp/eslint-ignore-project/package.json << 'EOF'
          {
            "name": "eslint-ignore-test",
            "version": "1.0.0",
            "devDependencies": {
              "eslint": "^8.57.0"
            }
          }
          EOF
          cat > /tmp/eslint-ignore-project/index.js << 'EOF'
          'use strict';
          const x = 1;
          module.exports = { x };
          EOF
          cat > /tmp/eslint-ignore-project/.eslintrc.json << 'EOF'
          {
            "env": { "node": true, "es2021": true },
            "parserOptions": { "ecmaVersion": 2021 },
            "rules": {}
          }
          EOF
          cd /tmp/eslint-ignore-project && npm install --silent

      - id: action
        uses: .
        with:
          all-files: 'true'
          working-directory: /tmp/eslint-ignore-project
          annotations: 'false'
          ignore-patterns: |
            **/*.js
            node_modules
        continue-on-error: true

      - name: Assert action ran with ignore patterns
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With all JS files ignored, ESLint should either find no files (success/notice)
          # or succeed because there's nothing to lint
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with ignore patterns applied"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
