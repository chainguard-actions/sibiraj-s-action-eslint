name: Test all-files basic usage
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up ESLint project in working directory
        run: |
          mkdir -p /tmp/eslint-project
          cat > /tmp/eslint-project/package.json << 'EOF'
          {
            "name": "eslint-test-project",
            "version": "1.0.0",
            "devDependencies": {
              "eslint": "^8.57.0"
            }
          }
          EOF
          cat > /tmp/eslint-project/index.js << 'EOF'
          'use strict';

          const greet = (name) => {
            return `Hello, ${name}!`;
          };

          module.exports = { greet };
          EOF
          cat > /tmp/eslint-project/.eslintrc.json << 'EOF'
          {
            "env": {
              "node": true,
              "es2021": true
            },
            "parserOptions": {
              "ecmaVersion": 2021
            },
            "rules": {}
          }
          EOF
          cd /tmp/eslint-project && npm install --silent

      - id: action
        uses: .
        with:
          all-files: 'true'
          working-directory: /tmp/eslint-project
          annotations: 'false'
        continue-on-error: true

      - name: Assert action ran (linting valid JS should succeed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: ESLint ran successfully on valid JS files"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
