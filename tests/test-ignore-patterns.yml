name: Test ESLint ignore-patterns input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up JS project with files to ignore
        run: |
          mkdir -p /tmp/eslint-ignore
          cd /tmp/eslint-ignore
          cat > package.json <<'EOF'
          {
            "name": "eslint-ignore-test",
            "version": "1.0.0",
            "devDependencies": {
              "eslint": "^8.57.0"
            }
          }
          EOF
          cat > .eslintrc.json <<'EOF'
          {
            "env": {
              "node": true,
              "es2021": true
            },
            "rules": {
              "no-console": "error"
            }
          }
          EOF
          # This file has a lint error (no-console) but will be ignored
          mkdir -p dist
          cat > dist/bundle.js <<'EOF'
          console.log("this would fail linting");
          EOF
          # This file is clean
          cat > index.js <<'EOF'
          const x = 1;
          module.exports = x;
          EOF
          npm install --silent

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          all-files: 'true'
          extensions: js
          annotations: 'false'
          ignore-patterns: 'dist/**'
          working-directory: /tmp/eslint-ignore

      - name: Assert action completed (dist files ignored)
        run: |
          echo "ESLint completed with dist files ignored"
          echo "PASS"
