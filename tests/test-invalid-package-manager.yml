name: Test invalid package manager - error handling
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With all-files: true, the action returns ['.'] as files (no API call needed).
      # It then calls getExecutionCommand() which throws for unsupported package manager 'yarn'
      # before any eslint invocation — so no eslint installation is needed.
      # The action should fail with an "Unsupported package manager" error.
      - id: action
        uses: .
        continue-on-error: true
        with:
          all-files: 'true'
          annotations: 'false'
          package-manager: yarn

      - name: Assert action failed with unsupported package manager
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with unsupported package manager 'yarn', but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for unsupported package manager"
