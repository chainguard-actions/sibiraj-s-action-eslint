name: Test ESLint action - ignore-path input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up test project with ignore file
        run: |
          mkdir -p /tmp/eslint-ignore-path-test
          cd /tmp/eslint-ignore-path-test

          cat > package.json << 'EOF'
          {
            "name": "eslint-ignore-path-test",
            "version": "1.0.0",
            "devDependencies": {
              "eslint": "^8.0.0"
            }
          }
          EOF

          # Create a valid JS file
          cat > index.js << 'EOF'
          const greeting = 'hello world';
          console.log(greeting);
          EOF

          # Create a file that would fail linting (uses var)
          mkdir -p dist
          cat > dist/bundle.js << 'EOF'
          var x = 1;
          console.log(x);
          EOF

          # Create a custom ignore file that ignores the dist directory
          cat > .myeslintignore << 'EOF'
          dist/
          EOF

          cat > .eslintrc.json << 'EOF'
          {
            "env": {
              "node": true,
              "es2021": true
            },
            "rules": {
              "no-var": "error"
            }
          }
          EOF

          npm install --prefer-offline 2>&1 | tail -5

      - name: Run ESLint action with ignore-path
        id: eslint
        uses: .
        with:
          all-files: 'true'
          working-directory: /tmp/eslint-ignore-path-test
          annotations: 'false'
          extensions: js
          ignore-path: /tmp/eslint-ignore-path-test/.myeslintignore
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action completed with ignore-path
        run: |
          echo "ESLint action completed with ignore-path"
          echo "PASS: ESLint ran with custom ignore-path and skipped dist directory"
