name: Test ESLint action - pull request context
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up test project
        run: |
          mkdir -p /tmp/eslint-pr-test
          cd /tmp/eslint-pr-test

          cat > package.json << 'EOF'
          {
            "name": "eslint-pr-test",
            "version": "1.0.0",
            "devDependencies": {
              "eslint": "^8.0.0"
            }
          }
          EOF

          cat > app.js << 'EOF'
          function add(a, b) {
            return a + b;
          }
          module.exports = { add };
          EOF

          cat > .eslintrc.json << 'EOF'
          {
            "env": {
              "node": true,
              "es2021": true
            },
            "rules": {}
          }
          EOF

          npm install --prefer-offline 2>&1 | tail -5

      - name: Run ESLint action in PR context with all-files
        id: eslint
        uses: .
        with:
          all-files: 'true'
          working-directory: /tmp/eslint-pr-test
          annotations: 'false'
          extensions: js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action completed in PR context
        run: |
          echo "ESLint action completed in PR context"
          echo "PASS: ESLint ran successfully in pull_request event context"
