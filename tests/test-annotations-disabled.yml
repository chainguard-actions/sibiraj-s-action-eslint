name: Test annotations disabled
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up ESLint project
        run: |
          mkdir -p /tmp/eslint-annot-project
          cat > /tmp/eslint-annot-project/package.json << 'EOF'
          {
            "name": "eslint-annot-test",
            "version": "1.0.0",
            "devDependencies": {
              "eslint": "^8.57.0"
            }
          }
          EOF
          cat > /tmp/eslint-annot-project/index.js << 'EOF'
          'use strict';
          const greet = (name) => `Hello, ${name}!`;
          module.exports = { greet };
          EOF
          cat > /tmp/eslint-annot-project/.eslintrc.json << 'EOF'
          {
            "env": { "node": true, "es2021": true },
            "parserOptions": { "ecmaVersion": 2021 },
            "rules": {}
          }
          EOF
          cd /tmp/eslint-annot-project && npm install --silent

      - id: action
        uses: .
        with:
          all-files: 'true'
          working-directory: /tmp/eslint-annot-project
          annotations: 'false'
        continue-on-error: true

      - name: Assert action ran with annotations disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with annotations disabled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (acceptable in harness environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
