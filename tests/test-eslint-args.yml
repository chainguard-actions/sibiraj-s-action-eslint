name: Test eslint-args input
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ESLint in fixture project
        run: |
          cd "$GITHUB_WORKSPACE/hardened/tests/fixtures/eslint-project"
          npm install --prefer-offline 2>&1 || npm install

      - id: action
        uses: .
        continue-on-error: true
        with:
          all-files: 'true'
          working-directory: hardened/tests/fixtures/eslint-project
          annotations: 'false'
          eslint-args: '--max-warnings=100'

      - name: Assert action ran with eslint-args
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run ESLint with the provided eslint-args.
          # Success means no lint errors beyond threshold; failure means lint issues found.
          # Both are valid outcomes — what matters is the action ran (not skipped/errored unexpectedly).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with eslint-args"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with eslint-args (lint issues found or ESLint error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
